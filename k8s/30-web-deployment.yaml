apiVersion: apps/v1
kind: Deployment
metadata:
  name: emprendermarket-web
  namespace: emprendermarket
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: emprendermarket-web
  template:
    metadata:
      labels:
        app: emprendermarket-web
    spec:
      containers:
        - name: web
          image: michacc/emprendemarket-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: emprendermarket-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: emprendermarket-secrets
                  key: default-connection
            - name: Redis__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: emprendermarket-secrets
                  key: redis-connection
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
