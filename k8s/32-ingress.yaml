apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emprendermarket
  namespace: emprendermarket
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: emprendermarket.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emprendermarket-web
                port:
                  number: 80
