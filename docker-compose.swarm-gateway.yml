services:
  desktop-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx.desktop.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - emprendemarket_net

networks:
  emprendemarket_net:
    external: true
    name: emprendemarket_emprendemarket_net
