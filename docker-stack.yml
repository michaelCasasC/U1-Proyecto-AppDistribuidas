version: "3.9"

secrets:
  postgres_password:
    external: true
  db_connection_string:
    external: true
  paypal_client_id:
    external: true
  paypal_client_secret:
    external: true
  payphone_token:
    external: true
  payphone_store_id:
    external: true
  email_smtp_password:
    external: true
  google_client_id:
    external: true
  google_client_secret:
    external: true

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local
  dataprotection_keys:
    driver: local
  redis_data:
    driver: local

networks:
  emprendemarket_net:
    driver: overlay
    attachable: true

configs:
  swarm_nginx:
    file: ./nginx.swarm.conf

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: EmprendeMarketDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emprendemarket_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 8 && ollama pull qwen2.5:0.5b && wait"]
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - emprendemarket_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - emprendemarket_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  web:
    image: michacc/emprendemarket-web:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=EmprendeMarketDB;Username=postgres;Password=admin"
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectRetry=3,connectTimeout=5000
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: qwen2.5:0.5b
      DataProtection__KeysPath: /app/dataprotection-keys
      Email__Smtp__Host: smtp.gmail.com
      Email__Smtp__Port: "587"
      Email__Smtp__User: macasas@espe.edu.ec
      Email__From: macasas@espe.edu.ec
      PayPal__BaseUrl: https://api-m.sandbox.paypal.com
      PayPhone__BaseUrl: https://pay.payphonetodoesposible.com
    secrets:
      - db_connection_string
      - paypal_client_id
      - paypal_client_secret
      - payphone_token
      - payphone_store_id
      - email_smtp_password
      - google_client_id
      - google_client_secret
    volumes:
      - dataprotection_keys:/app/dataprotection-keys
    networks:
      - emprendemarket_net
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  gateway:
    image: nginx:1.27-alpine
    configs:
      - source: swarm_nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - emprendemarket_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
